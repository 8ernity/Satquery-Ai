<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="cockpitBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#080F22"/>
      <stop offset="60%" stop-color="#030610"/>
      <stop offset="100%" stop-color="#010206"/>
    </radialGradient>

    <!-- 3D Perspective Grid Gradient -->
    <linearGradient id="perspGrid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0C4A6E" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Swipe Divider Neon Beam -->
    <linearGradient id="swipeBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>

    <!-- Extruded Prism Face Gradients -->
    <linearGradient id="prismFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#083344" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="prismSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="prismTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      .font-space { font-family: 'Space Grotesk', -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Deep Stage Background -->
  <rect width="1600" height="900" fill="url(#cockpitBg)"/>

  <!-- Top Title Header Block -->
  <g transform="translate(80, 45)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="680" height="80" rx="12" fill="#060B18" fill-opacity="0.94" stroke="#1F2937" stroke-width="1.5"/>
    <rect x="14" y="14" width="6" height="52" rx="3" fill="#06B6D4"/>
    <text x="34" y="38" fill="#FFFFFF" font-size="16" font-weight="bold" class="font-space">
      DUAL-DIMENSION 2D/3D SURVEILLANCE COCKPIT ARCHITECTURE
    </text>
    <text x="34" y="60" fill="#38BDF8" font-size="11" class="font-mono">
      0° Nadir Sub-meter Inspection ◄► 75° Oblique Tilt with Extruded Prism Terrain
    </text>
  </g>

  <!-- ================= 3D PERSPECTIVE CANOPY STAGE ================= -->
  <!-- Transformed 3D Stage Plane representing the tilted satellite view -->
  <g id="perspectiveStage" transform="translate(800, 480)">
    
    <!-- Horizon Line & Vanishing Perspective Grid Plane -->
    <polygon points="-640,160 -420,-180 420,-180 640,160" fill="rgba(6, 182, 212, 0.04)" stroke="url(#perspGrid)" stroke-width="1.2"/>

    <!-- Converging Perspective Longitudinal Grid Lines -->
    <g stroke="rgba(6, 182, 212, 0.18)" stroke-width="1">
      <line x1="-420" y1="-180" x2="-640" y2="160"/>
      <line x1="-280" y1="-180" x2="-420" y2="160"/>
      <line x1="-140" y1="-180" x2="-210" y2="160"/>
      <line x1="0" y1="-180" x2="0" y2="160"/>
      <line x1="140" y1="-180" x2="210" y2="160"/>
      <line x1="280" y1="-180" x2="420" y2="160"/>
      <line x1="420" y1="-180" x2="640" y2="160"/>
    </g>

    <!-- Transversal Latitudinal Distance Rings -->
    <g stroke="rgba(56, 189, 248, 0.22)" stroke-width="1">
      <line x1="-450" y1="-140" x2="450" y2="-140"/>
      <line x1="-490" y1="-90" x2="490" y2="-90"/>
      <line x1="-530" y1="-30" x2="530" y2="-30"/>
      <line x1="-575" y1="40" x2="575" y2="40"/>
      <line x1="-620" y1="120" x2="620" y2="120"/>
    </g>

    <!-- ================= LEFT HALF: T1 HISTORICAL BASELINE ================= -->
    <g id="t1Baseline" opacity="0.85">
      <!-- Ground Agricultural Texture Rectangles -->
      <polygon points="-380,-70 -260,-70 -290,10 -420,10" fill="rgba(16, 185, 129, 0.12)" stroke="#10B981" stroke-width="1"/>
      <text x="-370" y="-30" fill="#34D399" font-size="10" class="font-mono">T1: EMPTY FARMLAND</text>

      <!-- Old Ground Runway -->
      <polygon points="-240,-120 -210,-120 -240,60 -270,60" fill="rgba(148, 163, 184, 0.15)" stroke="#64748B" stroke-width="1"/>
    </g>

    <!-- ================= RIGHT HALF: T2 LIVE OBSERVATION (NEW STRUCTURES) ================= -->
    <g id="t2Observation">
      <!-- 3D Extruded Building Prism 1 (Commercial Tower: Height 80m) -->
      <g transform="translate(140, 20)">
        <!-- Front Face -->
        <polygon points="-35,0 35,0 35,-90 -35,-90" fill="url(#prismFront)" stroke="#22D3EE" stroke-width="1.5"/>
        <!-- Right Side Face -->
        <polygon points="35,0 70,-25 70,-115 35,-90" fill="url(#prismSide)" stroke="#0284C7" stroke-width="1.5"/>
        <!-- Top Roof Face -->
        <polygon points="-35,-90 0,-115 70,-115 35,-90" fill="url(#prismTop)" stroke="#BAE6FD" stroke-width="1.5"/>
        
        <!-- Floor Level Lines -->
        <line x1="-35" y1="-30" x2="35" y2="-30" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>
        <line x1="-35" y1="-60" x2="35" y2="-60" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>
        <line x1="35" y1="-30" x2="70" y2="-55" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>
        <line x1="35" y1="-60" x2="70" y2="-85" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>

        <!-- Height Tag -->
        <g transform="translate(45, -135)">
          <rect x="0" y="0" width="110" height="24" rx="4" fill="#0369A1" stroke="#38BDF8" stroke-width="1"/>
          <text x="10" y="16" fill="#FFFFFF" font-size="10" font-weight="bold" class="font-mono">PRISM: +80m</text>
        </g>
      </g>

      <!-- 3D Extruded Building Prism 2 (Residential Complex: Height 45m) -->
      <g transform="translate(280, -30)">
        <!-- Front Face -->
        <polygon points="-25,0 25,0 25,-55 -25,-55" fill="url(#prismFront)" stroke="#22D3EE" stroke-width="1.5"/>
        <!-- Right Side Face -->
        <polygon points="25,0 50,-18 50,-73 25,-55" fill="url(#prismSide)" stroke="#0284C7" stroke-width="1.5"/>
        <!-- Top Roof Face -->
        <polygon points="-25,-55 0,-73 50,-73 25,-55" fill="url(#prismTop)" stroke="#BAE6FD" stroke-width="1.5"/>

        <!-- Height Tag -->
        <g transform="translate(30, -90)">
          <rect x="0" y="0" width="105" height="22" rx="4" fill="#0C4A6E" stroke="#06B6D4" stroke-width="1"/>
          <text x="8" y="15" fill="#E0F2FE" font-size="9" font-weight="bold" class="font-mono">PRISM: +45m</text>
        </g>
      </g>

      <!-- AI Verified Visual Grounding Bounding Box -->
      <g transform="translate(180, 45)">
        <polygon points="-90,-25 180,-25 140,55 -130,55" fill="rgba(239, 68, 68, 0.2)" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#neonGlow)"/>
        <rect x="-130" y="55" width="220" height="24" rx="4" fill="#EF4444"/>
        <text x="-120" y="71" fill="#FFFFFF" font-size="10" font-weight="bold" class="font-mono">
          AI GROUNDING AOI (14.2% EXPANSION)
        </text>
      </g>
    </g>

    <!-- ================= LIVE ARTERIAL TRAFFIC CONGESTION VECTORS ================= -->
    <g id="trafficVectors" stroke-linecap="round">
      <!-- Free Flow Corridor (Green) -->
      <line x1="-520" y1="90" x2="-120" y2="10" stroke="#10B981" stroke-width="5" stroke-dasharray="8,4"/>
      <text x="-480" y="120" fill="#34D399" font-size="10" font-weight="bold" class="font-mono">NH-44 BYPASS: 76 km/h (FREE FLOW)</text>

      <!-- Moderate Arterial Corridor (Amber) -->
      <line x1="-120" y1="10" x2="160" y2="-60" stroke="#F59E0B" stroke-width="5"/>
      <text x="-80" y="32" fill="#FCD34D" font-size="9" font-weight="bold" class="font-mono">OUTER RING: 42 km/h</text>

      <!-- Congested Bottleneck Corridor (Red) -->
      <line x1="160" y1="-60" x2="480" y2="-120" stroke="#EF4444" stroke-width="6" filter="url(#neonGlow)"/>
      <text x="240" y="-85" fill="#F87171" font-size="10" font-weight="bold" class="font-mono">RIVER CROSSING: 14 km/h (CONGESTED)</text>
    </g>

    <!-- ================= BI-TEMPORAL SWIPE SLIDER DIVIDER ================= -->
    <!-- Center Dividing Vertical Neon Line -->
    <line x1="0" y1="-190" x2="0" y2="170" stroke="url(#swipeBeam)" stroke-width="3.5" filter="url(#neonGlow)"/>
    
    <!-- Center Interactive Handle -->
    <circle cx="0" cy="-10" r="22" fill="#06B6D4" stroke="#FFFFFF" stroke-width="2.5" filter="url(#neonGlow)"/>
    <!-- Double Horizontal Arrows -->
    <path d="M -8 -10 L -3 -15 L -3 -5 Z M 8 -10 L 3 -15 L 3 -5 Z" fill="#000000"/>

    <!-- Temporal Badge: Pre-Event (Left) -->
    <g transform="translate(-240, -165)">
      <rect x="0" y="0" width="220" height="30" rx="6" fill="#060E1A" stroke="#F59E0B" stroke-width="1.2"/>
      <circle cx="15" cy="15" r="4" fill="#F59E0B"/>
      <text x="28" y="19" fill="#FCD34D" font-size="10" font-weight="bold" class="font-mono">
        PRE-EVENT (T1 BASELINE)
      </text>
    </g>

    <!-- Temporal Badge: Post-Event (Right) -->
    <g transform="translate(20, -165)">
      <rect x="0" y="0" width="220" height="30" rx="6" fill="#060E1A" stroke="#06B6D4" stroke-width="1.2"/>
      <circle cx="15" cy="15" r="4" fill="#06B6D4"/>
      <text x="28" y="19" fill="#67E8F9" font-size="10" font-weight="bold" class="font-mono">
        POST-EVENT (T2 LIVE)
      </text>
    </g>
  </g>

  <!-- ================= TACTICAL HUD BOTTOM TELEMETRY CARDS ================= -->

  <!-- Card 1: 3D Camera Gimbal Telemetry -->
  <g transform="translate(80, 720)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="440" height="135" rx="10" fill="#060B18" fill-opacity="0.94" stroke="#1F2937" stroke-width="1.5"/>
    <text x="20" y="28" fill="#38BDF8" font-size="11" font-weight="bold" class="font-mono">3D CAMERA GIMBAL SPECIFICATIONS</text>
    
    <g transform="translate(20, 50)" font-size="10" class="font-mono">
      <text x="0" y="0" fill="#94A3B8">Pitch Inclination:</text>
      <text x="180" y="0" fill="#FFFFFF" font-weight="bold">45.0° Oblique (Range: 0°-75°)</text>

      <text x="0" y="24" fill="#94A3B8">Yaw Heading Azimuth:</text>
      <text x="180" y="24" fill="#38BDF8" font-weight="bold">+15.0° True North Orbit</text>

      <text x="0" y="48" fill="#94A3B8">Perspective Field of View:</text>
      <text x="180" y="48" fill="#A78BFA" font-weight="bold">1200px Dynamic Frustum</text>

      <text x="0" y="72" fill="#94A3B8">GSD Resolution at Nadir:</text>
      <text x="180" y="72" fill="#34D399" font-weight="bold">0.3m/px Sub-Meter Ground Truth</text>
    </g>
  </g>

  <!-- Card 2: Geodesic Shoelace Measurement -->
  <g transform="translate(580, 720)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="440" height="135" rx="10" fill="#060B18" fill-opacity="0.94" stroke="#1F2937" stroke-width="1.5"/>
    <text x="20" y="28" fill="#10B981" font-size="11" font-weight="bold" class="font-mono">GEODESIC MEASUREMENT ENGINE (WGS-84)</text>

    <g transform="translate(20, 50)" font-size="10" class="font-mono">
      <text x="0" y="0" fill="#94A3B8">Delineated Surface Area:</text>
      <text x="180" y="0" fill="#34D399" font-weight="bold">420.00 Ha (1,037.84 Acres)</text>

      <text x="0" y="24" fill="#94A3B8">Metric Square Metric:</text>
      <text x="180" y="24" fill="#FFFFFF" font-weight="bold">4.2000 km² (4,200,000 m²)</text>

      <text x="0" y="48" fill="#94A3B8">Bounding Perimeter Length:</text>
      <text x="180" y="48" fill="#6EE7B7" font-weight="bold">8.450 km Closed Polyline</text>

      <text x="0" y="72" fill="#94A3B8">Mathematical Formulation:</text>
      <text x="180" y="72" fill="#38BDF8" font-weight="bold">Spherical Shoelace Algorithm</text>
    </g>
  </g>

  <!-- Card 3: Disaster Evacuation Corridor -->
  <g transform="translate(1080, 720)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="440" height="135" rx="10" fill="#060E1A" fill-opacity="0.94" stroke="#1F2937" stroke-width="1.5"/>
    <text x="20" y="28" fill="#F59E0B" font-size="11" font-weight="bold" class="font-mono">LIVE EVACUATION &amp; TRAFFIC VECTORS</text>

    <g transform="translate(20, 50)" font-size="10" class="font-mono">
      <text x="0" y="0" fill="#94A3B8">Active Monitored Corridors:</text>
      <text x="180" y="0" fill="#FFFFFF" font-weight="bold">5 Strategic Arterials</text>

      <text x="0" y="24" fill="#94A3B8">Flooded / Blocked Corridors:</text>
      <text x="180" y="24" fill="#F87171" font-weight="bold">1 Choke Point Detected</text>

      <text x="0" y="48" fill="#94A3B8">Recommended Escape Route:</text>
      <text x="180" y="48" fill="#34D399" font-weight="bold">NH-44 Bypass Corridor (Clear)</text>

      <text x="0" y="72" fill="#94A3B8">Export Compatibility:</text>
      <text x="180" y="72" fill="#38BDF8" font-weight="bold">RFC 7946 GeoJSON / QGIS</text>
    </g>
  </g>
</svg>
